services:
  driveshare-db:
    image: postgres:16-alpine
    container_name: driveshare-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: driveshare_secret
      POSTGRES_DB: driveshare
    ports:
      - "5433:5432"
    volumes:
      - driveshare_pgdata:/var/lib/postgresql/data

volumes:
  driveshare_pgdata:
